name: Tested unsigned IPA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false # legacy OpenSSL submodule is not linked
      - name: Test, archive and package
        run: bash scripts/build_ipa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GetMoreRam-unsigned
          path: |
            build/GetMoreRam-unsigned.ipa
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
